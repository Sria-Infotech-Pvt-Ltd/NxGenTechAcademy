       third-party scripts. Tracking still fires the same events, just after
       load instead of at parse time; dataLayer pushes made before then are
       queued and processed once GTM initializes, so no events are lost. -->

        'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1214198700823851');

      ; (function (w, d, s, l, i) {

          'gtm.start':
            new Date().getTime(), event: 'gtm.js'
        }); var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
            'https://www.googletagmanager.com/gtm.js?id=' + i + dl;

    }
    if (document.readyState === 'complete') {
      nxgenLoadTracking();
    } else {
      window.addEventListener('load', nxgenLoadTracking);
    }
  </script>
